version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: snapshare_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: snapshare
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: snapshare_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/snapshare
      - JWT_SECRET=snapshare_jwt_super_secret_production_key_2026
      - JWT_REFRESH_SECRET=snapshare_refresh_jwt_super_secret_key_2026
      - GALLERY_TOKEN_SECRET=snapshare_gallery_token_super_secret_key_2026
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: snapshare_web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
